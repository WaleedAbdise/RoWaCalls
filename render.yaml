services:
  - type: web
    name: rowa-calls
    runtime: node
    plan: free
    buildCommand: npm run check
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: WALEED_PASSWORD
        sync: false
      - key: ROHA_PASSWORD
        sync: false
      - key: METERED_TURN_APP
        sync: false
      - key: METERED_TURN_API_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
